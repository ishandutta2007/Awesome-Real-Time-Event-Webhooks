<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wireGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" rx="12" />

  <!-- Animated Glowing Circuit Grid Lines in Background -->
  <g opacity="0.25">
    <path d="M 0,80 L 1200,80" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6" />
    <path d="M 0,160 L 1200,160" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,8" />
    <path d="M 0,240 L 1200,240" stroke="#c084fc" stroke-width="1" stroke-dasharray="6,6" />
    <path d="M 200,0 L 200,360" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 600,0 L 600,360" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />
    <path d="M 1000,0 L 1000,360" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Dynamic Event Flow Waves (Behind Text) -->
  <path d="M-100,180 C 150,80 350,280 600,180 C 850,80 1050,280 1300,180" fill="none" stroke="url(#wireGrad1)" stroke-width="2.5" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="10s" repeatCount="indefinite" />
  </path>

  <path d="M-100,220 C 200,320 400,120 650,220 C 900,320 1100,120 1300,220" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,8">
    <animate attributeName="stroke-dashoffset" from="0" to="400" dur="15s" repeatCount="indefinite" />
  </path>

  <!-- Animated Event Packets / Real-time Webhook Pulses -->
  <circle r="5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M-100,180 C 150,80 350,280 600,180 C 850,80 1050,280 1300,180" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle r="4" fill="#c084fc" filter="url(#glow)">
    <animateMotion path="M-100,180 C 150,80 350,280 600,180 C 850,80 1050,280 1300,180" dur="5s" begin="2.5s" repeatCount="indefinite" />
  </circle>

  <circle r="4.5" fill="#34d399" filter="url(#glow)">
    <animateMotion path="M-100,220 C 200,320 400,120 650,220 C 900,320 1100,120 1300,220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Dynamic Tech Nodes / Rings in corners -->
  <g transform="translate(100, 70)" opacity="0.6">
    <circle r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle r="12" fill="#38bdf8" fill-opacity="0.15" />
    <circle r="4" fill="#38bdf8" />
  </g>

  <g transform="translate(1100, 280)" opacity="0.6">
    <circle r="36" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6,4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle r="14" fill="#c084fc" fill-opacity="0.15" />
    <circle r="5" fill="#c084fc" />
  </g>

  <!-- High-Contrast Foreground Shield to Guarantee Text Legibility -->
  <rect x="150" y="55" width="900" height="245" rx="16" fill="#090d16" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />

  <!-- Badge Pill Above Title -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="300" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="1">REAL-TIME EVENT INFRASTRUCTURE</text>
  </g>

  <!-- Main Title (Strictly Foreground) -->
  <text x="600" y="165" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Real-Time Event Webhooks
  </text>

  <!-- Gradient Underline Accent -->
  <rect x="360" y="183" width="480" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" font-size="16.5" font-weight="400" fill="#94a3b8">
    Curated Hub for Gateways, Ingestion, Delivery, Routing, Retries &amp; Event-Driven Systems
  </text>

  <!-- Feature Tags / Chips -->
  <g transform="translate(600, 265)" text-anchor="middle" font-size="12" font-weight="600">
    <!-- Tag 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text y="4" fill="#38bdf8">⚡ Low-Latency</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text y="4" fill="#818cf8">🔄 Auto Retries</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(85, 0)">
      <rect x="-75" y="-12" width="150" height="24" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
      <text y="4" fill="#c084fc">🛡️ HMAC Signing</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(245, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text y="4" fill="#34d399">🌐 Open-Source</text>
    </g>
  </g>
</svg>